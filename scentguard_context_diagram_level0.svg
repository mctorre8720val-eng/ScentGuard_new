<svg width="1000" height="700" xmlns="http://www.w3.org/2000/svg">
  <style>
    .entity { fill: #f9f9f9; stroke: #333; stroke-width: 2; }
    .process { fill: #e8f5e9; stroke: #34c759; stroke-width: 3; }
    .text-main { font-family: 'Segoe UI', Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; }
    .text-entity { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: bold; text-anchor: middle; }
    .text-flow { font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; fill: #555; }
    .arrow { stroke: #333; stroke-width: 1.5; fill: none; marker-end: url(#arrowhead); }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="40" font-family="Arial" font-size="22" font-weight="bold" text-anchor="middle">ScentGuard System: Context Diagram (Level 0)</text>

  <!-- Central Process: ScentGuard System -->
  <circle cx="500" cy="350" r="110" class="process" />
  <text x="500" y="345" class="text-main">SCENTGUARD</text>
  <text x="500" y="365" class="text-main">SYSTEM</text>

  <!-- External Entity: Manager -->
  <rect x="50" y="100" width="180" height="80" rx="5" class="entity" />
  <text x="140" y="145" class="text-entity">RESTAURANT MANAGER</text>

  <!-- External Entity: Staff -->
  <rect x="50" y="520" width="180" height="80" rx="5" class="entity" />
  <text x="140" y="565" class="text-entity">RESTAURANT STAFF</text>

  <!-- External Entity: Sensors -->
  <rect x="770" y="100" width="180" height="80" rx="5" class="entity" />
  <text x="860" y="145" class="text-entity">GAS &amp; TEMP SENSORS</text>
  <text x="860" y="165" font-family="Arial" font-size="11" text-anchor="middle">(MQ135, DHT11)</text>

  <!-- External Entity: Actuators -->
  <rect x="770" y="520" width="180" height="80" rx="5" class="entity" />
  <text x="860" y="565" class="text-entity">ACTUATORS</text>
  <text x="860" y="585" font-family="Arial" font-size="11" text-anchor="middle">(Fan Relay, LED)</text>

  <!-- Flows: Manager <-> System -->
  <path d="M 230 120 L 400 300" class="arrow" />
  <text x="210" y="210" class="text-flow" transform="rotate(45, 210, 210)">Config Settings, Fan Control</text>

  <path d="M 410 330 L 230 170" class="arrow" />
  <text x="210" y="270" class="text-flow" transform="rotate(45, 210, 270)">Reports, Live Metrics, Alerts</text>

  <!-- Flows: Staff <-> System -->
  <path d="M 230 580 L 400 400" class="arrow" />
  <text x="250" y="470" class="text-flow" transform="rotate(-45, 250, 470)">Invite Code, Registration</text>

  <path d="M 410 370 L 230 530" class="arrow" />
  <text x="290" y="430" class="text-flow" transform="rotate(-45, 290, 430)">Status Updates, Alerts</text>

  <!-- Flows: Sensors -> System -->
  <path d="M 770 140 L 610 300" class="arrow" />
  <text x="650" y="200" class="text-flow" transform="rotate(-45, 650, 200)">Raw Sensor Data (PPM, Temp)</text>

  <!-- Flows: System -> Actuators -->
  <path d="M 590 410 L 770 560" class="arrow" />
  <text x="620" y="480" class="text-flow" transform="rotate(40, 620, 480)">Relay Pulse, LED Signals</text>

</svg>
